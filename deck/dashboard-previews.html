<title>Cumulus Dashboard Previews</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1f5fb;--card:#fff;--line:#e3e9f1;--ink:#16233b;--ink2:#3b5577;--ink3:#7b889c;--brand:#032d60;--hdr:#e3edf9;--good:#157347;--good-bg:#dff5e8;--bad:#b42318;--bad-bg:#fde2e2;--grid:#edf1f7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1622;--card:#171f2d;--line:#2a3546;--ink:#eef2f7;--ink2:#b9c3d2;--ink3:#8593a6;--brand:#dbe7f8;--hdr:#1d2e45;--good:#5ed195;--good-bg:#153826;--bad:#f07a7a;--bad-bg:#3f1d1d;--grid:#243043}}
:root[data-theme=dark]{--bg:#0f1622;--card:#171f2d;--line:#2a3546;--ink:#eef2f7;--ink2:#b9c3d2;--ink3:#8593a6;--brand:#dbe7f8;--hdr:#1d2e45;--good:#5ed195;--good-bg:#153826;--bad:#f07a7a;--bad-bg:#3f1d1d;--grid:#243043}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;font-size:14px}
.wrap{max-width:1400px;margin:0 auto;padding-block:16px;padding-inline:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.tab{font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.tab[aria-selected=true]{background:linear-gradient(90deg,#0b5cab,#1b7fd6);color:#fff;border-color:transparent}
.tab:focus-visible{outline:2px solid #0b5cab;outline-offset:2px}
.dash{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.hdrrow{display:grid;grid-template-columns:1fr 200px 200px;gap:14px}
.hdr{background:var(--hdr);border-color:var(--hdr)}
.hdr h1{margin:0;font-size:26px;font-weight:800;color:var(--brand);letter-spacing:-.02em}.hdr p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.flt label{display:block;font-size:12px;color:var(--ink3);margin-bottom:6px}.flt .sel{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;display:flex;justify-content:space-between}.flt .sel::after{content:"▾";color:var(--ink3)}
.banner{display:flex;align-items:center;gap:14px;border-radius:16px;padding:12px 18px;border:1px solid}
.banner.ok{background:linear-gradient(90deg,#d7f3e3,#eefaf3 60%,var(--card));color:#14532d;border-color:#a9e2bf}.banner.alert{background:linear-gradient(90deg,#fcd5d5,#fdeaea 60%,var(--card));color:#7f1d1d;border-color:#f3a9a9}
.banner .dot{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(255,255,255,.7);flex:none}.banner b{display:block;font-size:15px}.banner small{opacity:.85}.banner .act{margin-left:auto;background:#fff;color:inherit;border-radius:999px;padding:6px 14px;font-weight:600;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{--a:#0b5cab;border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(145deg,color-mix(in srgb,var(--a) 16%,var(--card)),color-mix(in srgb,var(--a) 5%,var(--card)) 55%,var(--card));border:1px solid color-mix(in srgb,var(--a) 22%,var(--card));min-height:150px}
.kpi .lb{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:color-mix(in srgb,var(--a) 70%,var(--ink))}.kpi .v{font-size:44px;font-weight:800;color:var(--a);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3);flex-wrap:wrap;justify-content:center}.pill{background:var(--card);padding:2px 9px;border-radius:999px;font-weight:700;box-shadow:0 1px 2px rgba(3,45,96,.08)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.kpi svg{width:100%;height:44px;margin-top:6px}
.band{display:grid;grid-template-columns:29% 1fr;gap:14px}.band.full{grid-template-columns:1fr}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.side{background:linear-gradient(180deg,#f3f7fd,var(--card) 40%)}.side h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--brand);display:flex;justify-content:space-between}.side h3 span{font-weight:500;font-size:12px;color:var(--ink3)}
.item{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 2px rgba(3,45,96,.05);background:var(--card)}
.rank{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0b5cab,#032d60);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}.item .n{font-weight:600;font-size:13px}.item .c{font-size:12px;color:var(--ink3)}.item .s{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}.item .btn{background:linear-gradient(90deg,#0b5cab,#1b7fd6);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.rb{display:grid;grid-template-columns:38% 1fr 60px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.rb .t{height:12px;background:var(--grid);border-radius:999px;overflow:hidden}.rb .f{height:100%;border-radius:999px;background:linear-gradient(90deg,#0b5cab,#5aa0ea)}.rb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.rb .num{text-align:right;font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums}
.chart h3{margin:0;font-size:16px;font-weight:700}.chart p{margin:2px 0 10px;font-size:12px;color:var(--ink3)}
svg.plot{width:100%;height:auto;display:block;font-family:inherit}svg.plot text{fill:var(--ink2);font-size:11px}svg.plot .g{stroke:var(--grid)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;opacity:0;z-index:9;white-space:nowrap}
.foot{font-size:12px;color:var(--ink3);margin-top:16px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.band,.row3,.hdrrow{grid-template-columns:1fr}}
</style>
