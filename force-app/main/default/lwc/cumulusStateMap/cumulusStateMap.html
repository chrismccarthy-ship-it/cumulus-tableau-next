<template>
    <div class="wrap">
        <template lwc:if={isConfigured}>
            <div class="head">
                <div class="heading">{heading}</div>
                <template lwc:if={subtitle}><div class="sub">{subtitle}</div></template>
            </div>
            <template lwc:if={error}><div class="error">{error}</div></template>
            <div class="mapbox">
                <svg class="map" viewBox={viewBox} preserveAspectRatio="xMidYMid meet" role="img" aria-label={heading}>
                    <g>
                        <template for:each={states} for:item="s">
                            <path key={s.code} class={s.cls} d={s.d} fill={s.fill} data-key={s.key} tabindex="0" role="button"
                                  onclick={handleSelect} onkeydown={handleKey}>
                                <title>{s.tip}</title>
                            </path>
                        </template>
                    </g>
                    <g class="bubbles">
                        <template for:each={states} for:item="s">
                            <template lwc:if={s.hasBubble}>
                                <circle key={s.code} class="bubble" cx={s.cx} cy={s.cy} r={s.r} fill={bubbleFill} data-key={s.key} onclick={handleSelect}>
                                    <title>{s.tip}</title>
                                </circle>
                            </template>
                        </template>
                    </g>
                    <g class="labels">
                        <template for:each={states} for:item="s">
                            <template lwc:if={s.showLabel}>
                                <text key={s.code} class="label" x={s.cx} y={s.cy} text-anchor="middle" dy="4">{s.code}</text>
                            </template>
                        </template>
                        <template for:each={regionLabels} for:item="r">
                            <text key={r.key} class="label region" x={r.x} y={r.y} text-anchor="middle">{r.key}</text>
                        </template>
                    </g>
                </svg>
            </div>
            <template lwc:if={legend}>
                <div class="legend">
                    <span>{legend.lo}</span><span class="ramp" style={legend.style}></span><span>{legend.hi}</span>
                    <template lwc:if={legend.bubbleLabel}>
                        <span class="bubkey"><i style={legend.bubbleStyle}></i>{legend.bubbleLabel}</span>
                    </template>
                    <span class="hint">click a state to filter</span>
                </div>
            </template>
        </template>
        <template lwc:else>
            <div class="configure">Map a semantic model, a state/region dimension and a measure in the widget panel.</div>
        </template>
    </div>
</template>
