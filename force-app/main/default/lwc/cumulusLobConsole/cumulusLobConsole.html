<template>
    <div class="root" style={rootStyle}>
        <template lwc:if={isConfigured}>
            <div class="topbar">
                <span class="who">👤 {title}</span>
                <div class="filters">
                    <label>Period <select onchange={onPeriod}><template for:each={periodOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label>
                    <template lwc:if={hasRegion}><label>{regionLabel} <select onchange={onRegion}><template for:each={regionOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></template>
                </div>
            </div>
            <div class="tabs">
                <button class={tabInsightsClass} data-tab="insights" onclick={setTab}>✦ Tableau Agent Headless Insights</button>
                <button class={tabTableClass} data-tab="table" onclick={setTab}>▦ Data Table</button>
                <template lwc:if={hasReport}><button class={tabReportClass} data-tab="report" onclick={setTab}>▤ Report</button></template>
            </div>
            <template lwc:if={error}><div class="error">{error}</div></template>

            <template lwc:if={tabInsights}>
                <div class="banner"><span class="chip">✦ TABLEAU AGENT HEADLESS INSIGHT</span><div class="btitle">{banner.title}</div><div class="bsub">{banner.sub}</div></div>
                <div class="kpis" style={kpiGridStyle}>
                    <template for:each={kpis} for:item="k">
                        <div class={k.cls} key={k.key}><div class="kv">{k.text}</div><div class="kl">{k.label}</div><div class="ks">{k.sub}</div>
                            <template lwc:if={k.hasSpark}><svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none"><path class="area" d={k.area}></path><path class="line" d={k.line}></path><circle class="end" cx={k.endx} cy={k.endy} r="2.5"></circle></svg></template>
                        </div>
                    </template>
                </div>
                <div class="split">
                    <div class="left">
                        <div class="lhead"><span>AI-driven insights</span><button class="mini" onclick={regenerate} title="Regenerate from the live data">↻ Regenerate</button></div>
                        <template for:each={insightCards} for:item="i">
                            <div class={i.cls} key={i.id}>
                                <template lwc:if={i.isEditing}>
                                    <input class="edit" type="text" value={editing.title} oninput={onEditTitle} data-bind="title"/>
                                    <textarea class="edit" rows="5" value={editing.body} oninput={onEditBody} data-bind="body"></textarea>
                                    <div class="acts"><button class="act go" onclick={saveInsight}>Save</button><button class="act" onclick={cancelEdit}>Cancel</button></div>
                                </template>
                                <template lwc:else>
                                    <div class="ihead"><span class="iicon">{i.icon}</span><span class="ititle">{i.title}</span><button class="pencil" data-id={i.id} onclick={editInsight} title="Edit insight">✎</button></div>
                                    <p class="ibody">{i.body}</p>
                                    <div class="acts">
                                        <template lwc:if={i.btnCase}><button class="act red" data-action="case" data-id={i.id} onclick={insightAction}>⚑ Escalate</button></template>
                                        <template lwc:if={i.btnSchedule}><button class="act amber" data-action="schedule" data-id={i.id} onclick={insightAction}>📅 Schedule Review</button></template>
                                        <button class="act" data-action="task" data-id={i.id} onclick={insightAction}>👤 {i.taskLabel}</button>
                                        <button class="act" data-action="flow" data-id={i.id} onclick={insightAction}>⇶ Launch Flow</button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="right">
                        <div class="thead"><div><div class="ttitle">{entityLabel} Performance</div><div class="tsub">Click Analyze to deep-dive · {periodLabel}</div></div></div>
                        <div class="tscroll">
                            <table>
                                <thead><tr><th>Status</th><th>{entityLabel}</th><template lwc:if={hasRegion}><th>{regionLabel}</th></template><template for:each={columns} for:item="c"><th class="r" key={c}>{c}</th></template><th>Actions</th></tr></thead>
                                <tbody>
                                    <template for:each={entities} for:item="b">
                                        <tr key={b.entity}>
                                            <td><span class={b.badgeClass}>{b.badge}</span></td>
                                            <td class="bname">{b.short}</td>
                                            <template lwc:if={hasRegion}><td class="muted">{b.region}</td></template>
                                            <template for:each={b.cells} for:item="c"><td class="r" key={c.key}>{c.text}</td></template>
                                            <td class="actions">
                                                <button class="act teal" data-action="analyze" data-entity={b.entity} onclick={rowAction}>✦ Analyze</button>
                                                <button class="act" data-action="case" data-entity={b.entity} onclick={rowAction}>⊕ Case</button>
                                                <button class="act" data-action="schedule" data-entity={b.entity} onclick={rowAction}>📅 Review</button>
                                                <button class="act" data-action="flow" data-entity={b.entity} onclick={rowAction}>⇶ Flow</button>
                                                <button class="act" data-action="report" data-entity={b.entity} onclick={rowAction}>▤ Report</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>

            <template lwc:if={tabTable}>
                <div class="right full">
                    <div class="thead"><div><div class="ttitle">All {entityLabel}s</div><div class="tsub">{periodLabel}</div></div></div>
                    <table>
                        <thead><tr><th>Status</th><th>{entityLabel}</th><template lwc:if={hasRegion}><th>{regionLabel}</th></template><template for:each={columns} for:item="c"><th class="r" key={c}>{c}</th></template></tr></thead>
                        <tbody><template for:each={entities} for:item="b"><tr key={b.entity}><td><span class={b.badgeClass}>{b.badge}</span></td><td class="bname">{b.short}</td><template lwc:if={hasRegion}><td class="muted">{b.region}</td></template><template for:each={b.cells} for:item="c"><td class="r" key={c.key}>{c.text}</td></template></tr></template></tbody>
                    </table>
                </div>
            </template>

            <template lwc:if={tabReport}>
                <template lwc:if={hasReport}>
                    <div class="reportcard">
                        <div class="rhead"><div><div class="rtitle">Report: {lastReport.question}</div><div class="rsub">{reportLine}</div></div>
                            <div class="racts"><button class="act light" onclick={openReportModal}>Open · Export PDF · Email · Slack</button><button class="act light" onclick={closeReport}>✕ Close report</button></div></div>
                        <div class="rq"><div class="rlabel">Analysis question</div>{lastReport.question}</div>
                        <div class="rlabel">Agentforce analysis</div><p class="summary">{lastReport.analysis.summary}</p>
                        <div class="rlabel">Key findings</div><ul><template for:each={lastReport.analysis.findings} for:item="f"><li key={f}>{f}</li></template></ul>
                        <div class="bars"><template for:each={reportBars} for:item="b"><div class="bar" key={b.label}><span class="bl">{b.label}</span><span class="track"><span class="fill" style={b.style}></span></span><span class="bv">{b.value}</span></div></template></div>
                        <div class="rlabel">Recommended actions</div><ul><template for:each={lastReport.analysis.actions} for:item="a"><li key={a.title}><b>{a.title}:</b> {a.body}</li></template></ul>
                        <p class="caveat">{lastReport.analysis.caveat}</p>
                    </div>
                </template>
            </template>

            <template lwc:if={modalOpen}><c-cumulus-action-modal mode={modalMode} context={modalContext} accent={accent} onclose={closeModal} onreask={onReask}></c-cumulus-action-modal></template>
            <div class="footnote">{footnote}</div>
        </template>
        <template lwc:else><div class="configure">Select the semantic model and provide a console config (JSON) in the widget panel.</div></template>
    </div>
</template>
